name: deploy

# push main 自动部署；workflow 自身/文档改动不触发（避免 Dependabot 升级 actions 后白跑部署）
# workflow_dispatch 为手动入口，不受 paths 限制，可随时强制部署
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 同分支并发只保留最后一次（对应旧 deploy.sh 锁文件的防重入）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # 构建指令沿用原 deploy.sh（Astro 产物默认输出到 dist/）
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，构建产物路径异常（检查 astro outDir）"
            exit 1
          fi

      # 构建产物直接铺到站点根目录（不带 dist/ 子目录）
      # 只同步清单内文件：清单里的新增/修改才上传，构建产物删掉的文件才从服务器删除；
      # 服务器原有数据不在清单里，永不触碰；.user.ini / .well-known 为 aaPanel 托管，排除保留
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DIR: ${{ secrets.SERVER_HOMEPAGE_DIR }}
        run: |
          set -Eeuo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN" -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$DIR' && rm -rf '$DIR/.git' '$DIR/.github' '$DIR/.gitignore' '$DIR/.gitattributes' '$DIR/HANDOFF.md'"
          DEPLOY_HOST="$USER@$HOST" DEPLOY_DEST="$DIR" DEPLOY_SSH_KEY="$KEY" \
            bash ci/deploy-managed.sh dist ci/deploy-exclude.txt
