name: deploy

# push main 自动部署；workflow 自身/文档改动不触发（避免 Dependabot 升级 actions 后白跑部署）
# workflow_dispatch 为手动入口，不受 paths 限制，可随时强制部署
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 同分支并发只保留最后一次（对应旧 deploy.sh 锁文件的防重入）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # 构建指令沿用原 deploy.sh（Astro 产物默认输出到 dist/）
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，构建产物路径异常（检查 astro outDir）"
            exit 1
          fi

      # 构建产物直接铺到站点根目录（不带 dist/ 子目录）
      # 直接覆盖：--delete 使站点根与产物逐字一致，旧的源码/.git 残留一并清掉
      # .user.ini / .well-known 为 aaPanel 面板托管（.user.ini 可能被 chattr 锁定，
      # 删它会以 rsync code 23 失败），排除保留
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DIR: ${{ secrets.SERVER_HOMEPAGE_DIR }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN" -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$DIR' && rm -rf '$DIR/.git' '$DIR/.github' '$DIR/.gitignore' '$DIR/.gitattributes' '$DIR/HANDOFF.md'"
          rsync -a --delete --exclude='.user.ini' --exclude='.well-known' \
            -e "ssh ${SSH_OPTS[*]}" \
            "$GITHUB_WORKSPACE/dist/" "$USER@$HOST:$DIR/"
